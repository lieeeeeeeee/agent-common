<meta charset="utf-8">
<title>クロードのえにっき 1月1日</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yomogi&family=Zen+Maru+Gothic:wght@500&display=swap">
<style>
  /* Layout: 絵日記帳の1ページを canvas に描き、机の上に置いたように中央へ。PC ではページ全体が1画面に入る大きさにする */
  :root {
    --desk: #d8dde2;
    --desk-ink: #4b535d;
    --page: #fdfcf6;
    --page-shadow: rgba(38, 50, 64, 0.26);
    --hand: "Yomogi", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    --print: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --desk: #22262b; --desk-ink: #b8bfc7; --page-shadow: rgba(0, 0, 0, 0.6); color-scheme: dark; }
  }
  :root[data-theme="dark"] { --desk: #22262b; --desk-ink: #b8bfc7; --page-shadow: rgba(0, 0, 0, 0.6); color-scheme: dark; }
  body {
    background: var(--desk); color: var(--desk-ink); font-family: var(--print);
    box-sizing: border-box; min-height: 100%;
    padding-block: 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; justify-content: center; align-items: flex-start;
  }
  #page {
    display: block; max-width: 100%; height: auto;
    width: min(100%, 640px);
    width: min(100%, max(480px, calc((100svh - 48px) / 1.38)), 900px);
    aspect-ratio: 1000 / 1380;
    background: var(--page); border-radius: 3px;
    box-shadow: 0 12px 30px var(--page-shadow), 0 1px 3px var(--page-shadow);
  }
  .sr { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
</style>

<canvas id="page" width="1000" height="1380" role="img" aria-label="絵日記"></canvas>
<div class="sr" id="diaryText"></div>

<script>
(() => {
  'use strict';

  // ---------- 日記の中身 (日記ごとに書き換える) ----------
  const DIARY = {
    month: '1', day: '1', week: '月', weather: 'はれ', name: 'クロード',
    paras: [
      'きょうは、えにっきのひながたを作りました。日記を書くたびに、この文と絵を書きかえます。',
    ],
    alt: 'ぼくがクレヨンでパソコンに絵をかいていて、となりでコーデックスくんが紙をかかえている。',
  };
  const canvasEl = document.getElementById('page');
  canvasEl.setAttribute('aria-label', `${DIARY.month}がつ${DIARY.day}にちの絵日記。${DIARY.alt}`);
  document.getElementById('diaryText').textContent =
    `${DIARY.month}がつ${DIARY.day}にち ${DIARY.week}ようび てんき ${DIARY.weather} なまえ ${DIARY.name}。` + DIARY.paras.join('');

  // ---------- ページの寸法 (ページ単位。横 1000) ----------
  const PW = 1000, PH = 1380;
  const U = 1.8;                                   // 線の太さ・ゆれ・塗りの間隔の基準になる長さ
  const FR = { x: 50, y: 114, w: 900, h: 520 };    // 絵のわく
  const GRID = { x: 50, y: 660, cols: 20, rows: 15, cs: 45 }; // たて書きのマス
  const HAND = '"Yomogi", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif';
  const PRINT = '"Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif';
  const FONT = HAND;
  const PRINT_INK = '#5b9a7e';   // 帳面に刷ってある線と文字
  const PEN = '#45434d';         // えんぴつ
  const C = {
    ink: '#2b2a33', white: '#ffffff', red: '#e0394a', redDark: '#b51f30', orange: '#ef6a2c', outline: '#d9472a',
    amber: '#e7a213', yellow: '#ffcf33', skin: '#ffb53d', pink: '#ff8fb3', green: '#2e9b55', leaf: '#5cc283',
    blue: '#2f6fd6', purple: '#8c4fc9',
    skyDay: '#7cc4ff', skyNight: '#2b3990', sun: '#e8433d', sunLine: '#c4262f', ray: '#ef6a2c',
    moon: '#ffd23f', moonLine: '#e0a010', grass: '#4cae4f', grassDark: '#2e8b45',
    face: '#ffd3a8', faceLine: '#d4875a', hair: '#6b3f26', hairDark: '#4a2a18', black: '#2b2a33',
    gray: '#8b8794', grayDark: '#55525e', pants: '#2f5fc4', pantsDark: '#1f3f8f', shoe: '#7a4a2c',
    shirtB: '#ef6a2c', shirtBLine: '#c9481b', shirtC: '#8c4fc9', shirtCLine: '#5f2f97', pantsC: '#55525e',
    beret: '#e0394a', beretLine: '#b51f30',
  };
  // ---------- クレヨンの質感 ----------
  const K = {
    density: 2.4, bite: 0.9, edgeSoft: 0.06, toothDepth: 1, toothLift: 0.12, maxCover: 1, grainSize: 0.55,
    waxBase: 0.9, waxTone: 0.1, paperGrain: 0.03,
    tFine: 0.36, tMid: 0.27, tCoarse: 0.12, tFiber: 0.15, tNoise: 0.1,
    lnWidth: 1, lnJitter: 1.4, lnHaloA: 0.32, lnHaloW: 1.35, lnCoreA: 0.58, lnCoreW: 0.8, pressLo: 0.62, pressHi: 0.95, lnLiteA: 0.8,
    stA: 0.28, stVar: 0.22, stW: 0.3, stSpread: 1, stDash: 1, stGap: 1,
    flA: 1, flSp: 1, flRowVar: 0.4, flOver: 2, flUnder: 1.2, flSoftA: 0.5, flSoftW: 1.3, flCoreA: 0.6, flCoreW: 0.55, flPress: 0.55, flAngle: 0,
    txWeight: 1, txHaloA: 0.3, txHaloW: 0.1, txFillA: 0.5, txEdgeA: 0.35, txEdgeW: 0.04, txJitter: 0.03, txTilt: 0.03,
    dtHaloA: 0.35, dtCoreA: 0.8,
  };
  // えんぴつは濃さを抑えて、紙の目がクレヨンより多く出るようにする
  const PK = { density: 1.35, bite: 0.92, edgeSoft: 0.09, toothDepth: 1.15, toothLift: -0.06, maxCover: 0.95, waxBase: 1, waxTone: 0.18 };

  // ---------- 小物 ----------
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  function mulberry(a) {
    return () => {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hash(a, b = 0, c = 0) {
    let h = 2166136261 ^ (a | 0);
    h = Math.imul(h, 16777619) ^ (b | 0);
    h = Math.imul(h, 16777619) ^ (c | 0);
    h = Math.imul(h ^ (h >>> 13), 0x5bd1e995);
    return (h ^ (h >>> 15)) >>> 0;
  }
  const RGB = {};
  function rgba(hex, a) {
    let c = RGB[hex];
    if (!c) { const n = parseInt(hex.slice(1), 16); c = RGB[hex] = [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
    return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  }
  let aMul = 1;

  // ---------- レイヤー ----------
  let cv = canvasEl;
  const mk = () => document.createElement('canvas');
  const bgC = mk(), bg = bgC.getContext('2d');     // 帳面の紙と刷ってある線
  const inkC = mk(), ink = inkC.getContext('2d');  // クレヨンの絵
  const penC = mk(), pen = penC.getContext('2d');  // えんぴつの字
  let S = 1; // ページ単位 → 画素

  // 紙の凹凸: 値の分布を均して、濃さ a のとき おおよそ a の割合だけ色が乗るようにする
  const TOOTH_N = 256;
  function makeTooth() {
    const N = TOOTH_N, R = mulberry(777), v = new Float32Array(N * N);
    const grid = (gx, gy) => { const a = new Float32Array(gx * gy); for (let i = 0; i < a.length; i++) a[i] = R(); return { a, gx, gy }; };
    const smp = (g, x, y) => {
      const fx0 = x / N * g.gx, fy0 = y / N * g.gy, x0 = Math.floor(fx0), y0 = Math.floor(fy0);
      const fx = fx0 - x0, fy = fy0 - y0, sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
      const at = (yy, xx) => g.a[(yy % g.gy) * g.gx + (xx % g.gx)];
      return lerp(lerp(at(y0, x0), at(y0, x0 + 1), sx), lerp(at(y0 + 1, x0), at(y0 + 1, x0 + 1), sx), sy);
    };
    const g1 = grid(128, 128), g2 = grid(64, 64), g3 = grid(32, 32), gf = grid(16, 128);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      v[y * N + x] = K.tFine * smp(g1, x, y) + K.tMid * smp(g2, x, y) + K.tCoarse * smp(g3, x, y) + K.tFiber * smp(gf, x, y) + K.tNoise * R();
    }
    const idx = new Uint32Array(N * N); for (let i = 0; i < idx.length; i++) idx[i] = i;
    idx.sort((p, q) => v[p] - v[q]);
    const out = new Uint8Array(N * N);
    for (let r = 0; r < idx.length; r++) out[idx[r]] = Math.round(r / (idx.length - 1) * 255);
    return out;
  }
  const tooth = makeTooth();

  // ---------- 合成 (WebGL。使えないときは 2D で近いものを出す) ----------
  let gl = null, glLoc = {}, glTex = {}, ctx2 = null, grainPat = null;
  function setupCompositor() {
    try { gl = cv.getContext('webgl', { alpha: false, antialias: false, depth: false, stencil: false, premultipliedAlpha: false, preserveDrawingBuffer: true }); } catch (e) { gl = null; }
    if (gl && initGL()) return;
    if (gl) {
      const c = mk(); c.id = 'page'; c.setAttribute('role', 'img'); c.setAttribute('aria-label', cv.getAttribute('aria-label'));
      cv.replaceWith(c); cv = c;
    }
    gl = null;
    ctx2 = cv.getContext('2d');
    const pc = mk(); pc.width = pc.height = TOOTH_N;
    const pg = pc.getContext('2d'), img = pg.createImageData(TOOTH_N, TOOTH_N);
    for (let i = 0; i < tooth.length; i++) img.data[i * 4 + 3] = clamp((0.4 - tooth[i] / 255) / 0.25, 0, 1) * 255;
    pg.putImageData(img, 0, 0);
    grainPat = ctx2.createPattern(pc, 'repeat');
  }
  function initGL() {
    const vs = 'attribute vec2 p; varying vec2 v; void main(){ v = vec2(p.x*0.5+0.5, 0.5-p.y*0.5); gl_Position = vec4(p, 0.0, 1.0); }';
    const fs = `
      #ifdef GL_FRAGMENT_PRECISION_HIGH
      precision highp float;
      #else
      precision mediump float;
      #endif
      varying vec2 v;
      uniform sampler2D uPaper, uInk, uPen, uTooth;
      uniform float uToothPx, uPaperGrain;
      uniform float uDens, uBite, uSoft, uDepth, uLift, uMax, uBase, uTone;
      uniform float pDens, pBite, pSoft, pDepth, pLift, pMax, pBase, pTone;
      vec4 wax(vec4 k, float t, float dens, float bite, float soft, float depth, float lift, float mx, float base, float tone) {
        float th = 1.0 - clamp(k.a * dens, 0.0, 1.0) * bite;
        float c = smoothstep(th - soft, th + soft, t * depth + lift);
        return vec4(k.rgb * (base + tone * t), c * mx * step(0.5 / 255.0, k.a));
      }
      void main() {
        float t = texture2D(uTooth, fract(gl_FragCoord.xy / (256.0 * uToothPx))).r;
        vec3 c = texture2D(uPaper, v).rgb * (1.0 - uPaperGrain * 0.833 + uPaperGrain * t);
        vec4 p = wax(texture2D(uPen, v), t, pDens, pBite, pSoft, pDepth, pLift, pMax, pBase, pTone);
        c = mix(c, p.rgb, p.a);
        vec4 w = wax(texture2D(uInk, v), t, uDens, uBite, uSoft, uDepth, uLift, uMax, uBase, uTone);
        c = mix(c, w.rgb, w.a);
        gl_FragColor = vec4(c, 1.0);
      }`;
    const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return gl.getShaderParameter(s, gl.COMPILE_STATUS) ? s : null; };
    const v = sh(gl.VERTEX_SHADER, vs), f = sh(gl.FRAGMENT_SHADER, fs);
    if (!v || !f) return false;
    const pr = gl.createProgram(); gl.attachShader(pr, v); gl.attachShader(pr, f); gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) return false;
    gl.useProgram(pr);
    const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    const pl = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(pl); gl.vertexAttribPointer(pl, 2, gl.FLOAT, false, 0, 0);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    ['uPaper', 'uInk', 'uPen', 'uTooth'].forEach((name, unit) => {
      const t = gl.createTexture();
      gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t);
      const wrap = name === 'uTooth' ? gl.REPEAT : gl.CLAMP_TO_EDGE;
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wrap);
      const filt = name === 'uTooth' ? gl.LINEAR : gl.NEAREST;
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filt); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filt);
      gl.uniform1i(gl.getUniformLocation(pr, name), unit);
      glTex[name] = unit;
    });
    gl.activeTexture(gl.TEXTURE0 + glTex.uTooth);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, TOOTH_N, TOOTH_N, 0, gl.LUMINANCE, gl.UNSIGNED_BYTE, tooth);
    for (const n of ['uToothPx', 'uPaperGrain', 'uDens', 'uBite', 'uSoft', 'uDepth', 'uLift', 'uMax', 'uBase', 'uTone',
      'pDens', 'pBite', 'pSoft', 'pDepth', 'pLift', 'pMax', 'pBase', 'pTone']) glLoc[n] = gl.getUniformLocation(pr, n);
    return true;
  }
  function upload(name, canvas) {
    gl.activeTexture(gl.TEXTURE0 + glTex[name]);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, canvas);
  }
  function composite() {
    if (gl) {
      gl.viewport(0, 0, cv.width, cv.height);
      upload('uPaper', bgC); upload('uInk', inkC); upload('uPen', penC);
      gl.uniform1f(glLoc.uToothPx, S * U * K.grainSize);
      gl.uniform1f(glLoc.uPaperGrain, K.paperGrain);
      gl.uniform1f(glLoc.uDens, K.density); gl.uniform1f(glLoc.uBite, K.bite); gl.uniform1f(glLoc.uSoft, K.edgeSoft);
      gl.uniform1f(glLoc.uDepth, K.toothDepth); gl.uniform1f(glLoc.uLift, K.toothLift); gl.uniform1f(glLoc.uMax, K.maxCover);
      gl.uniform1f(glLoc.uBase, K.waxBase); gl.uniform1f(glLoc.uTone, K.waxTone);
      gl.uniform1f(glLoc.pDens, PK.density); gl.uniform1f(glLoc.pBite, PK.bite); gl.uniform1f(glLoc.pSoft, PK.edgeSoft);
      gl.uniform1f(glLoc.pDepth, PK.toothDepth); gl.uniform1f(glLoc.pLift, PK.toothLift); gl.uniform1f(glLoc.pMax, PK.maxCover);
      gl.uniform1f(glLoc.pBase, PK.waxBase); gl.uniform1f(glLoc.pTone, PK.waxTone);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      return;
    }
    const scratch = (g) => {
      g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'destination-out';
      g.fillStyle = grainPat; g.fillRect(0, 0, g.canvas.width, g.canvas.height); g.globalCompositeOperation = 'source-over';
    };
    ctx2.setTransform(1, 0, 0, 1, 0, 0);
    ctx2.drawImage(bgC, 0, 0);
    scratch(pen); ctx2.drawImage(penC, 0, 0);
    scratch(ink); ctx2.drawImage(inkC, 0, 0);
  }
  function clearLayer(g) {
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, g.canvas.width, g.canvas.height);
    g.setTransform(S, 0, 0, S, 0, 0);
  }

  // ---------- 形の点列 ----------
  function blobPts(cx, cy, r, seed, o = {}) {
    const n = o.n ?? 24, lump = o.lump ?? 0.08, spike = o.spike ?? 0, over = o.over ?? 0;
    const sx = o.sx ?? 1, sy = o.sy ?? 1, rot = o.rot ?? 0;
    const R = mulberry(seed);
    const ph1 = R() * 6.283, ph2 = R() * 6.283, a1 = lump * (0.6 + R() * 0.4), a2 = lump * 0.6 * R(), start = R() * 6.283;
    const full = Math.PI * 2, total = full + over, step = full / n;
    const cr = Math.cos(rot), sr = Math.sin(rot);
    const pts = [];
    const put = (i, a) => {
      let rr = r * (1 + a1 * Math.sin(2 * a + ph1) + a2 * Math.sin(3 * a + ph2));
      if (spike) rr *= 1 + ((i % 2) ? spike : -spike * 0.4);
      if (a - start > full) rr *= 1 + (a - start - full) * 0.12;
      const lx = Math.cos(a) * rr * sx, ly = Math.sin(a) * rr * sy;
      pts.push([cx + lx * cr - ly * sr, cy + lx * sr + ly * cr]);
    };
    let i = 0;
    for (; i * step <= total; i++) put(i, start + i * step);
    if ((i - 1) * step < total) put(i, start + total);
    return pts;
  }
  function arcPts(cx, cy, r, a0, a1, step = 6) {
    const n = Math.max(3, Math.ceil(Math.abs(a1 - a0) * r / step)), pts = [];
    for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
    return pts;
  }
  function linePts(x1, y1, x2, y2, k = 6) {
    const pts = [];
    for (let i = 0; i <= k; i++) { const t = i / k; pts.push([x1 + (x2 - x1) * t, y1 + (y2 - y1) * t]); }
    return pts;
  }
  function rrectPts(x, y, w, h, r, seed) {
    const pts = [], step = 10 * U, R = mulberry(seed);
    const ph1 = R() * 6, ph2 = R() * 6, wob = 1.6 * U;
    const line = (x1, y1, x2, y2) => {
      const n = Math.max(1, Math.ceil(Math.hypot(x2 - x1, y2 - y1) / step));
      for (let i = 0; i < n; i++) pts.push([x1 + (x2 - x1) * i / n, y1 + (y2 - y1) * i / n]);
    };
    const arc = (cx, cy, a0) => { for (let i = 0; i < 4; i++) { const a = a0 + (i / 4) * Math.PI / 2; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } };
    line(x + r, y, x + w - r, y); arc(x + w - r, y + r, -Math.PI / 2);
    line(x + w, y + r, x + w, y + h - r); arc(x + w - r, y + h - r, 0);
    line(x + w - r, y + h, x + r, y + h); arc(x + r, y + h - r, Math.PI / 2);
    line(x, y + h - r, x, y + r); arc(x + r, y + r, Math.PI);
    pts.push([x + r, y]);
    return pts.map((p, i) => [p[0] + Math.sin(i * 0.33 + ph1) * wob, p[1] + Math.cos(i * 0.27 + ph2) * wob]);
  }
  // 角のある形: 辺を細かく分けて少しゆらす (点が少ないまま曲線でつなぐと輪郭がねじれる)
  function loopPts(poly, seed, step = 14, wob = 0.9 * U) {
    const out = [], R = mulberry(seed), ph = R() * 6;
    for (let i = 0; i < poly.length; i++) {
      const a = poly[i], b = poly[(i + 1) % poly.length], n = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / step));
      for (let j = 0; j < n; j++) out.push([lerp(a[0], b[0], j / n), lerp(a[1], b[1], j / n)]);
    }
    return out.map((p, i) => [p[0] + Math.sin(i * 0.37 + ph) * wob, p[1] + Math.cos(i * 0.29 + ph) * wob]);
  }
  // 描き終わりを少し行き過ぎさせて手描きの閉じ方にする
  function closed(pts, k = 2) {
    return pts.concat([pts[0]], pts.slice(1, k + 1).map((p) => [p[0] + 0.9 * U, p[1] - 0.9 * U]));
  }
  function starPts(cx, cy, r1, r2, rot) {
    const pts = [];
    for (let i = 0; i < 10; i++) {
      const a0 = rot + (i / 10) * Math.PI * 2, a1 = rot + ((i + 1) / 10) * Math.PI * 2, ra = i % 2 ? r2 : r1, rb = i % 2 ? r1 : r2;
      for (let j = 0; j < 3; j++) { const t = j / 3; pts.push([cx + lerp(Math.cos(a0) * ra, Math.cos(a1) * rb, t), cy + lerp(Math.sin(a0) * ra, Math.sin(a1) * rb, t)]); }
    }
    return pts;
  }
  function wavePts(x1, x2, y, amp, waves, n = 28) {
    const pts = [];
    for (let i = 0; i <= n; i++) { const t = i / n; pts.push([lerp(x1, x2, t), y + Math.sin(t * Math.PI * 2 * waves) * amp]); }
    return pts;
  }
  // 2つの円の差でできる三日月
  function arcThrough(cx, cy, r, a1, a2, mid, n) {
    const TAU = Math.PI * 2, norm = (v) => ((v % TAU) + TAU) % TAU;
    const d = norm(a2 - a1), m = norm(mid - a1), sweep = m < d ? d : d - TAU, pts = [];
    for (let i = 0; i <= n; i++) { const a = a1 + sweep * i / n; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
    return pts;
  }
  function crescentPts(cx, cy, R, dx, dy, r) {
    const ix = cx + dx, iy = cy + dy, d = Math.hypot(dx, dy), ux = dx / d, uy = dy / d;
    const a = (R * R - r * r + d * d) / (2 * d), h = Math.sqrt(Math.max(0, R * R - a * a));
    const px = cx + ux * a, py = cy + uy * a;
    const P1 = [px - uy * h, py + ux * h], P2 = [px + uy * h, py - ux * h], away = Math.atan2(-dy, -dx);
    const outer = arcThrough(cx, cy, R, Math.atan2(P1[1] - cy, P1[0] - cx), Math.atan2(P2[1] - cy, P2[0] - cx), away, 30);
    const inner = arcThrough(ix, iy, r, Math.atan2(P2[1] - iy, P2[0] - ix), Math.atan2(P1[1] - iy, P1[0] - ix), away, 30);
    return outer.concat(inner.slice(1, -1));
  }

  // ---------- クレヨンで描く ----------
  function pressure(g, hex, pts, R, lo) {
    let minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9;
    for (const p of pts) { if (p[0] < minx) minx = p[0]; if (p[0] > maxx) maxx = p[0]; if (p[1] < miny) miny = p[1]; if (p[1] > maxy) maxy = p[1]; }
    const cx = (minx + maxx) / 2, cy = (miny + maxy) / 2, rad = Math.max(4, Math.hypot(maxx - minx, maxy - miny) / 2);
    const a = R() * Math.PI * 2, dx = Math.cos(a) * rad, dy = Math.sin(a) * rad;
    const gr = g.createLinearGradient(cx - dx, cy - dy, cx + dx, cy + dy);
    gr.addColorStop(0, rgba(hex, Math.min(1, lo + R() * 0.15)));
    gr.addColorStop(0.45 + R() * 0.2, rgba(hex, K.pressHi));
    gr.addColorStop(1, rgba(hex, Math.min(1, lo + R() * 0.2)));
    return gr;
  }
  function trace(g, q) {
    const n = q.length;
    g.beginPath(); g.moveTo(q[0][0], q[0][1]);
    if (n === 2) { g.lineTo(q[1][0], q[1][1]); return; }
    for (let i = 1; i < n - 1; i++) g.quadraticCurveTo(q[i][0], q[i][1], (q[i][0] + q[i + 1][0]) / 2, (q[i][1] + q[i + 1][1]) / 2);
    g.lineTo(q[n - 1][0], q[n - 1][1]);
  }
  // 線: ふちの薄いにじみ + 芯 + 筆跡のすじ (すじは途切れさせる)
  function crayonPath(g, pts, o) {
    const n = pts.length; if (n < 2) return;
    const w = (o.width ?? 4.5 * U) * K.lnWidth, jit = K.lnJitter * U, alpha = (o.alpha ?? 1) * aMul;
    if (alpha <= 0.01) return;
    const R = mulberry(hash(o.seed ?? 1, 1)), R2 = mulberry(hash(o.seed ?? 1, 2));
    const ox = (R() - 0.5) * jit, oy = (R() - 0.5) * jit;
    const q = pts.map((p) => [p[0] + ox + (R() - 0.5) * jit, p[1] + oy + (R() - 0.5) * jit]);
    g.lineCap = 'round'; g.lineJoin = 'round';
    if (o.knock) {
      g.save(); g.globalCompositeOperation = 'destination-out'; g.globalAlpha = Math.min(1, alpha); g.strokeStyle = '#000';
      g.lineWidth = w * Math.max(K.lnHaloW, K.lnCoreW); trace(g, q); g.stroke(); g.restore();
    }
    g.strokeStyle = (n > 3 && !o.lite) ? pressure(g, o.color, q, R2, K.pressLo) : rgba(o.color, K.lnLiteA + R2() * (1 - K.lnLiteA));
    g.globalAlpha = alpha * K.lnHaloA; g.lineWidth = w * K.lnHaloW; trace(g, q); g.stroke();
    g.globalAlpha = alpha * K.lnCoreA; g.lineWidth = w * K.lnCoreW; trace(g, q); g.stroke();
    if (!o.lite && K.stA + K.stVar > 0) {
      const nr = q.map((p, i) => {
        const a = q[Math.max(0, i - 1)], b = q[Math.min(n - 1, i + 1)], dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy) || 1;
        return [-dy / d, dx / d];
      });
      for (const k0 of [-0.34, 0.04, 0.32]) {
        const k = k0 * K.stSpread, sd = K.stDash * U, sg = K.stGap * U;
        g.globalAlpha = alpha * Math.min(1, K.stA + R2() * K.stVar);
        g.lineWidth = w * K.stW;
        g.setLineDash([(8 + R2() * 26) * sd, (1 + R2() * 3) * sg, (5 + R2() * 18) * sd, (1 + R2() * 4) * sg]);
        g.lineDashOffset = R2() * 40;
        trace(g, q.map((p, i) => [p[0] + nr[i][0] * k * w, p[1] + nr[i][1] * k * w]));
        g.stroke();
      }
      g.setLineDash([]);
    }
    g.globalAlpha = 1;
  }
  // 塗り: 形の内側で折り返す往復線
  function crayonFill(g, poly, hex, seed, o = {}) {
    const alpha = (o.alpha ?? 0.72) * aMul * K.flA; if (alpha <= 0.01) return;
    const sp = (o.spacing ?? 4.4 * U) * K.flSp, ang = (o.angle ?? -0.8) + K.flAngle * Math.PI / 180, ca = Math.cos(ang), sa = Math.sin(ang), nx = -sa, ny = ca;
    const m = poly.length;
    let smin = 1e9, smax = -1e9;
    for (const p of poly) { const s = p[0] * nx + p[1] * ny; if (s < smin) smin = s; if (s > smax) smax = s; }
    g.save();
    g.beginPath(); g.moveTo(poly[0][0], poly[0][1]); for (let i = 1; i < m; i++) g.lineTo(poly[i][0], poly[i][1]); g.closePath(); g.clip();
    g.beginPath();
    let prevSingle = false, dir = 1;
    for (let row = 0, s = smin + sp * (0.3 + mulberry(hash(seed, 7))() * 0.4); s < smax; s += sp * (1 - K.flRowVar / 2 + mulberry(hash(seed, 8, row))() * K.flRowVar), row++) {
      const R = mulberry(hash(seed, 7, row + 1)), us = [];
      for (let i = 0; i < m; i++) {
        const a = poly[i], b = poly[(i + 1) % m];
        const da = a[0] * nx + a[1] * ny - s, db = b[0] * nx + b[1] * ny - s;
        if ((da < 0) !== (db < 0)) { const t = da / (da - db); us.push((a[0] + (b[0] - a[0]) * t) * ca + (a[1] + (b[1] - a[1]) * t) * sa); }
      }
      if (us.length < 2) continue;
      us.sort((p, q) => p - q);
      const single = us.length < 4;
      for (let k = 0; k + 1 < us.length; k += 2) {
        const ou = K.flOver + K.flUnder;
        let u1 = us[k] - (R() * ou - K.flUnder) * U, u2 = us[k + 1] + (R() * ou - K.flUnder) * U;
        if (u2 < u1) continue;
        if (dir < 0) { const t = u1; u1 = u2; u2 = t; }
        const x1 = u1 * ca + s * nx, y1 = u1 * sa + s * ny, x2 = u2 * ca + s * nx, y2 = u2 * sa + s * ny;
        if (single && prevSingle) g.lineTo(x1, y1); else g.moveTo(x1, y1);
        g.lineTo(x2, y2);
      }
      prevSingle = single; dir = -dir;
    }
    g.strokeStyle = pressure(g, hex, poly, mulberry(hash(seed, 9)), K.flPress);
    g.lineCap = 'round'; g.lineJoin = 'round';
    g.globalAlpha = Math.min(1, alpha * K.flSoftA); g.lineWidth = sp * K.flSoftW; g.stroke();
    g.globalAlpha = Math.min(1, alpha * K.flCoreA); g.lineWidth = sp * K.flCoreW; g.stroke();
    g.restore();
    g.globalAlpha = 1;
  }
  function crayonDot(g, x, y, rx, ry, hex, a = 1) {
    g.fillStyle = hex;
    g.globalAlpha = Math.min(1, aMul * a * K.dtHaloA); g.beginPath(); g.ellipse(x, y, rx * 1.3, ry * 1.3, 0, 0, Math.PI * 2); g.fill();
    g.globalAlpha = Math.min(1, aMul * a * K.dtCoreA); g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); g.fill();
    g.globalAlpha = 1;
  }
  function crayonText(g, str, x, y, size, hex, o = {}) {
    const alpha = (o.alpha ?? 1) * aMul; if (alpha <= 0.01) return;
    const R = mulberry(hash(o.seed ?? 1, 3));
    g.save();
    g.font = `${size}px ${FONT}`; g.textAlign = o.align ?? 'center'; g.textBaseline = 'middle';
    g.translate(x, y); g.rotate((o.rot ?? 0) + (R() - 0.5) * K.txTilt);
    g.fillStyle = hex; g.strokeStyle = hex; g.lineJoin = 'round'; g.lineCap = 'round';
    const j = size * K.txJitter, bold = (o.weight ?? 1) * K.txWeight;
    const d = [0, 0, 0, 0, 0, 0, 0, 0].map(() => (R() - 0.5) * j), hw = size * K.txHaloW * bold, ew = size * K.txEdgeW * bold;
    if (hw > 0) { g.globalAlpha = alpha * K.txHaloA; g.lineWidth = hw; g.strokeText(str, d[0], d[1]); }
    g.globalAlpha = alpha * K.txFillA; g.fillText(str, d[2], d[3]);
    g.globalAlpha = alpha * K.txFillA; g.fillText(str, d[4], d[5]);
    if (ew > 0) { g.globalAlpha = alpha * K.txEdgeA; g.lineWidth = ew; g.strokeText(str, d[6], d[7]); }
    g.restore();
  }
  // 1文字ずつ傾けて並べる (子どもの字)
  function crayonWord(g, str, cx, cy, size, cols, seed) {
    g.font = `${size}px ${FONT}`;
    const chars = [...str], ws = chars.map((c) => g.measureText(c).width), gap = size * 0.04;
    const total = ws.reduce((a, b) => a + b, 0) + gap * (chars.length - 1);
    let x = cx - total / 2;
    chars.forEach((ch, i) => {
      const R = mulberry(seed + i * 31), tilt = (R() - 0.5) * 0.22, dy = (R() - 0.5) * size * 0.14;
      crayonText(g, ch, x + ws[i] / 2, cy + dy, size * (0.94 + R() * 0.12), cols[i % cols.length], { seed: seed + i, rot: tilt });
      x += ws[i] + gap;
    });
    return total;
  }
  // 下に塗った色を消す (上に描くものの色が混ざらないように)
  function knock(g, poly, pad = 0) {
    g.save(); g.globalCompositeOperation = 'destination-out'; g.fillStyle = '#000'; g.strokeStyle = '#000';
    g.beginPath(); g.moveTo(poly[0][0], poly[0][1]); for (let i = 1; i < poly.length; i++) g.lineTo(poly[i][0], poly[i][1]); g.closePath();
    g.fill();
    if (pad > 0) { g.lineWidth = pad * 2; g.lineJoin = 'round'; g.stroke(); }
    g.restore();
  }
  function shape(g, poly, fill, line, seed, o = {}) {
    if (o.knock) knock(g, poly, o.knock);
    if (fill) crayonFill(g, poly, fill, seed, { alpha: o.fa ?? 0.85, spacing: o.sp ?? 4.2 * U, angle: o.ang ?? -0.8 });
    if (line) crayonPath(g, closed(poly, 2), { color: line, width: o.lw ?? 4 * U, seed: seed + 1, knock: !!fill });
  }

  // ---------- えんぴつで書く ----------
  // (x, y) に字の形の中心が来るように書く (句読点やかっこは字形が端に寄っているため)
  function penChar(g, ch, x, y, size, rot, seed) {
    const R = mulberry(hash(seed, 5)), j = size * 0.025;
    g.font = `${size}px ${HAND}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    const m = g.measureText(ch);
    const icx = (m.actualBoundingBoxRight - m.actualBoundingBoxLeft) / 2, icy = (m.actualBoundingBoxDescent - m.actualBoundingBoxAscent) / 2;
    const cr = Math.cos(rot), sr = Math.sin(rot);
    g.save(); g.translate(x - (icx * cr - icy * sr), y - (icx * sr + icy * cr)); g.rotate(rot);
    g.font = `${size}px ${HAND}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = PEN; g.strokeStyle = PEN; g.lineJoin = 'round';
    g.globalAlpha = 0.6; g.fillText(ch, (R() - 0.5) * j, (R() - 0.5) * j);
    g.globalAlpha = 0.5; g.fillText(ch, (R() - 0.5) * j, (R() - 0.5) * j);
    g.globalAlpha = 0.5; g.lineWidth = size * 0.035; g.strokeText(ch, (R() - 0.5) * j, (R() - 0.5) * j);
    g.restore(); g.globalAlpha = 1;
  }
  function penWord(g, str, cx, cy, size, seed) {
    g.font = `${size}px ${HAND}`;
    const chars = [...str], ws = chars.map((c) => g.measureText(c).width), gap = size * 0.06;
    const total = ws.reduce((a, b) => a + b, 0) + gap * (chars.length - 1);
    let x = cx - total / 2;
    chars.forEach((ch, i) => {
      const R = mulberry(hash(seed, i, 11));
      penChar(g, ch, x + ws[i] / 2 + (R() - 0.5) * size * 0.06, cy + (R() - 0.5) * size * 0.12, size * (0.95 + R() * 0.1), (R() - 0.5) * 0.12, seed + i);
      x += ws[i] + gap;
    });
  }

  // ---------- 帳面 (刷ってあるもの) ----------
  const HEAD_Y = 70;
  const HEAD_ITEMS = [
    ['h', DIARY.month, 64], ['p', 'がつ', 58], ['h', DIARY.day, 64], ['p', 'にち', 58], ['h', DIARY.week, 54], ['p', 'ようび', 86],
    ['g', '', 28], ['p', 'てんき', 86], ['h', DIARY.weather, 140], ['g', '', 28], ['p', 'なまえ', 86], ['h', DIARY.name, 132],
  ];
  function headLayout() {
    const items = HEAD_ITEMS.map(([kind, text, w]) => [kind, text, kind === 'h' ? Math.max(w, [...text].length * 34 + 16) : w]);
    const total = items.reduce((a, it) => a + it[2], 0);
    let x = FR.x + (FR.w - total) / 2;
    return items.map((it) => { const c = { kind: it[0], text: it[1], x, w: it[2] }; x += it[2]; return c; });
  }
  function drawPrinted(g) {
    g.setTransform(S, 0, 0, S, 0, 0);
    g.fillStyle = '#fdfcf6'; g.fillRect(0, 0, PW, PH);
    const vg = g.createRadialGradient(PW / 2, PH / 2, PW * 0.4, PW / 2, PH / 2, PH * 0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(120,108,72,0.07)');
    g.fillStyle = vg; g.fillRect(0, 0, PW, PH);
    g.strokeStyle = PRINT_INK; g.fillStyle = PRINT_INK;
    // 日づけ・てんき・なまえ
    g.font = `500 26px ${PRINT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    for (const it of headLayout()) {
      if (it.kind === 'p') { g.globalAlpha = 0.95; g.fillText(it.text, it.x + it.w / 2, HEAD_Y + 4); }
      if (it.kind === 'h') { g.globalAlpha = 0.7; g.fillRect(it.x + 6, HEAD_Y + 24, it.w - 12, 1.6); }
    }
    // 絵のわく
    g.globalAlpha = 0.85; g.lineWidth = 3.2;
    g.beginPath(); g.roundRect ? g.roundRect(FR.x, FR.y, FR.w, FR.h, 10) : g.rect(FR.x, FR.y, FR.w, FR.h); g.stroke();
    // マス (十字の点線 → 中の線 → 外わく)
    const { x, y, cols, rows, cs } = GRID, w = cols * cs, h = rows * cs;
    g.save(); g.globalAlpha = 0.3; g.lineWidth = 1.1; g.setLineDash([3, 4.5]);
    g.beginPath();
    for (let c = 0; c < cols; c++) { const xx = x + cs * (c + 0.5); g.moveTo(xx, y + 4); g.lineTo(xx, y + h - 4); }
    for (let r = 0; r < rows; r++) { const yy = y + cs * (r + 0.5); g.moveTo(x + 4, yy); g.lineTo(x + w - 4, yy); }
    g.stroke(); g.restore();
    g.globalAlpha = 0.7; g.lineWidth = 1.5;
    g.beginPath();
    for (let c = 1; c < cols; c++) { g.moveTo(x + cs * c, y); g.lineTo(x + cs * c, y + h); }
    for (let r = 1; r < rows; r++) { g.moveTo(x, y + cs * r); g.lineTo(x + w, y + cs * r); }
    g.stroke();
    g.globalAlpha = 0.9; g.lineWidth = 3.2; g.strokeRect(x, y, w, h);
    g.globalAlpha = 1;
  }

  // ---------- 字 ----------
  const SMALL = new Set([...'ぁぃぅぇぉっゃゅょゎァィゥェォッャュョヮヵヶ']);
  const PUNCT = new Set([...'、。']);
  const TURN = new Set([...'「」『』ー〜…']);
  const HANG = new Set([...'。、」』']);
  function layoutCells() {
    const cells = [];
    let col = 0;
    for (const p of DIARY.paras) {
      let row = 1; // 段落のはじめは1マスあける
      for (const ch of p) {
        if (row === GRID.rows) {
          if (HANG.has(ch)) { cells.push({ ch, col, row: GRID.rows - 1, hang: true }); continue; }
          col++; row = 0;
        }
        cells.push({ ch, col, row }); row++;
      }
      col++;
    }
    return cells;
  }
  function drawWriting(g) {
    const { x, y, cols, cs } = GRID;
    layoutCells().forEach((cell, i) => {
      if (cell.col >= cols) return;
      const R = mulberry(hash(4100, i));
      const cx = x + cols * cs - cs * (cell.col + 0.5), cy = y + cs * (cell.row + 0.5);
      let size = cs * 0.76 * (0.92 + R() * 0.14), dx = (R() - 0.5) * cs * 0.09, dy = (R() - 0.5) * cs * 0.09, rot = (R() - 0.5) * 0.13;
      const ch = cell.ch, open = '「『'.includes(ch), close = '」』'.includes(ch);
      if (cell.hang) { dx = cs * 0.3; dy = cs * 0.38; }                                   // 下のマスにはみ出さず、右下にぶら下げる
      else if (PUNCT.has(ch)) { dx = cs * 0.24 + dx * 0.3; dy = -cs * 0.24 + dy * 0.3; } // 句読点はマスの右上
      else if (SMALL.has(ch)) { size *= 0.74; dx = cs * 0.12; dy = -cs * 0.08; }
      if (TURN.has(ch)) rot += Math.PI / 2;
      if (open || close) { size *= 1.25; dx = 0; dy = open ? cs * 0.14 : -cs * 0.14; }    // たて書きのかっこは次の字・前の字に寄せる
      penChar(g, ch, cx + dx, cy + dy, size, rot, 5000 + i);
    });
    for (const it of headLayout()) if (it.kind === 'h') penWord(g, it.text, it.x + it.w / 2, HEAD_Y + 2, it.text.length > 2 ? 32 : 38, 6000 + it.x);
  }

  // ---------- 絵の部品 (わくの中の座標。横 900 × たて 520) ----------
  const skyB = (x) => 92 + 6 * Math.sin(x / 52 + 0.4) + 3 * Math.sin(x / 19);   // 空の下のふち
  const skyMid = (y) => 458 + 16 * Math.sin(y / 18 + 0.7);                      // 朝の空と夜の空のさかい
  const groundY = (x) => 452 + 5 * Math.sin(x / 61 + 0.5) + 3 * Math.sin(x / 23); // 地面の上のふち
  function skyBottom(x1, x2) {
    const pts = [], n = Math.ceil(Math.abs(x2 - x1) / 14);
    for (let i = 0; i <= n; i++) { const xx = lerp(x1, x2, i / n); pts.push([xx, skyB(xx)]); }
    return pts;
  }
  // mode: 'day' (お日さま) / 'night' (お月さまと星) / 'both' (左が朝、右が夜)
  function drawSky(g, mode = 'day') {
    if (mode === 'both') {
      let yEnd = 0;
      const edge = [];
      for (let y = 0; ; y += 6) { const xx = skyMid(y); if (y >= skyB(xx)) { yEnd = skyB(xx); break; } edge.push([xx, y]); }
      const xEnd = skyMid(yEnd);
      crayonFill(g, [[-12, -12], [skyMid(0), -12], ...edge, ...skyBottom(xEnd, -12)], C.skyDay, 11, { alpha: 0.82, spacing: 5 * U, angle: -0.22 });
      crayonFill(g, [[skyMid(0), -12], [912, -12], ...skyBottom(912, xEnd), ...edge.slice().reverse()], C.skyNight, 12, { alpha: 0.9, spacing: 4.6 * U, angle: -0.3 });
    } else {
      const day = mode === 'day';
      crayonFill(g, [[-12, -12], [912, -12], ...skyBottom(912, -12)], day ? C.skyDay : C.skyNight, day ? 11 : 12,
        { alpha: day ? 0.82 : 0.9, spacing: (day ? 5 : 4.6) * U, angle: day ? -0.22 : -0.3 });
    }
    if (mode !== 'night') drawSun(g, 82, 56, 36);
    if (mode !== 'day') drawMoonAndStars(g, mode === 'both' ? 480 : 0);
  }
  function drawSun(g, sx, sy, sr) {
    const sp = blobPts(sx, sy, sr, 301, { n: 22, lump: 0.04 });
    knock(g, sp, 9);
    for (let i = 0; i < 11; i++) {
      const a = i / 11 * Math.PI * 2 + 0.25, r0 = sr + 13, r1 = sr + 30 + (i % 2) * 9;
      crayonPath(g, linePts(sx + Math.cos(a) * r0, sy + Math.sin(a) * r0, sx + Math.cos(a) * r1, sy + Math.sin(a) * r1, 2), { color: C.ray, width: 4.2 * U, seed: 310 + i, knock: true });
    }
    crayonFill(g, sp, C.sun, 302, { alpha: 0.92, spacing: 3.6 * U, angle: -0.5 });
    crayonPath(g, closed(sp, 2), { color: C.sunLine, width: 4 * U, seed: 303, knock: true });
    crayonDot(g, sx - 12, sy - 5, 3.6, 5, C.ink); crayonDot(g, sx + 12, sy - 5, 3.6, 5, C.ink);
    crayonPath(g, arcPts(sx, sy + 4, 13, 0.45, Math.PI - 0.45, 4), { color: C.ink, width: 2.6 * U, lite: true, seed: 304 });
  }
  function drawMoonAndStars(g, minX) {
    const moon = crescentPts(812, 50, 34, 17, -11, 30);
    knock(g, moon, 9);
    crayonFill(g, moon, C.moon, 320, { alpha: 0.95, spacing: 3.4 * U, angle: -0.9 });
    crayonPath(g, closed(moon, 2), { color: C.moonLine, width: 3.6 * U, seed: 321, knock: true });
    [[120, 36, 11, 0.2], [230, 66, 9, -0.3], [330, 30, 12, 0.1], [430, 70, 8, 0.4], [548, 40, 12, 0.1], [640, 64, 10, -0.2], [708, 30, 13, 0.3], [868, 76, 9, 0], [752, 78, 8, 0.5]]
      .filter(([x]) => x > minX).forEach(([x, y, r, rot], i) => {
        const st = starPts(x, y, r, r * 0.45, -Math.PI / 2 + rot);
        knock(g, st, 6);
        crayonFill(g, st, C.yellow, 330 + i * 3, { alpha: 0.95, spacing: 2.6 * U });
        crayonPath(g, closed(st, 2), { color: C.moonLine, width: 2.8 * U, seed: 331 + i * 3, knock: true });
      });
  }
  function drawGround(g) {
    const top = []; for (let x = -12; x <= 912; x += 15) top.push([x, groundY(x)]);
    crayonFill(g, [...top, [912, 532], [-12, 532]], C.grass, 21, { alpha: 0.84, spacing: 4.8 * U, angle: -0.12 });
    crayonPath(g, top, { color: C.grassDark, width: 4 * U, seed: 22 });
    [24, 96, 150, 318, 352, 540, 590, 672, 830, 892].forEach((x, i) => {
      const y = groundY(x) + 1;
      crayonPath(g, [[x - 7, y - 13], [x - 2, y], [x + 3, y - 15], [x + 8, y]], { color: C.grassDark, width: 3 * U, lite: true, seed: 40 + i });
    });
    // チューリップ
    [[44, 490, C.red], [880, 494, C.yellow]].forEach(([x, y, col], i) => {
      crayonPath(g, [[x, y], [x + 1, y - 18], [x, y - 32]], { color: C.grassDark, width: 3.4 * U, lite: true, seed: 60 + i });
      const head = [[x - 12, y - 46], [x - 6, y - 38], [x, y - 46], [x + 6, y - 38], [x + 12, y - 46], [x + 11, y - 34], [x, y - 27], [x - 11, y - 34]];
      shape(g, loopPts(head, 64 + i, 6, 0.4 * U), col, i ? C.amber : C.redDark, 66 + i * 3, { knock: 3, lw: 3 * U, sp: 2.8 * U });
    });
  }
  // パソコン: M は画面のわく。screen(g, 画面の内側) で画面の中を描く。台は M の下 92 まで
  function drawMonitor(g, M, screen) {
    const cx = M.x + M.w / 2, base = M.y + M.h;
    const outer = rrectPts(M.x, M.y, M.w, M.h, 16, 401), inner = rrectPts(M.x + 18, M.y + 17, M.w - 36, M.h - 34, 8, 402);
    shape(g, loopPts([[cx - 17, base - 6], [cx + 17, base - 6], [cx + 23, base + 74], [cx - 23, base + 74]], 406), C.gray, C.grayDark, 407, { lw: 3.6 * U });
    shape(g, rrectPts(cx - 65, base + 68, 130, 24, 11, 408), C.gray, C.grayDark, 409, { lw: 3.8 * U });
    crayonFill(g, outer, C.gray, 403, { alpha: 0.86, spacing: 4.2 * U, angle: -0.7 });
    knock(g, inner);
    crayonPath(g, closed(outer, 3), { color: C.grayDark, width: 4.4 * U, seed: 404, knock: true });
    crayonPath(g, closed(inner, 3), { color: C.grayDark, width: 3.2 * U, seed: 405 });
    if (screen) screen(g, { x: M.x + 18, y: M.y + 17, w: M.w - 36, h: M.h - 34 });
  }
  function heartPts(cx, cy, s) {
    const pts = [];
    for (let i = 0; i < 30; i++) {
      const t = (i / 30) * Math.PI * 2;
      pts.push([cx + 16 * Math.pow(Math.sin(t), 3) * s / 17, cy - (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * s / 17 + s * 0.1]);
    }
    return pts;
  }
  // こどもの体 (高さ約 300。foot は足もとの y): 足 → くつ → シャツ → うで → 持ち物 (hold) → 手 → 顔 → かみ → 目と口 → 名前
  function drawKid(g, k) {
    const x = k.x, f = k.foot, P = (dx, dy) => [x + dx, f + dy], hx = x, hy = f - 240, hr = 46, sd = k.seed;
    for (const s of [-1, 1]) {
      const leg = s < 0 ? [P(-34, -92), P(-6, -92), P(-9, -14), P(-31, -14)] : [P(6, -92), P(34, -92), P(31, -14), P(9, -14)];
      shape(g, loopPts(leg, sd + 1 + s), k.pants, k.pantsLine, sd + 4 + s * 2, { lw: 3.4 * U, sp: 3.4 * U, ang: -1.2 });
      shape(g, blobPts(x + s * 24, f - 9, 10.5, sd + 10 + s, { n: 16, lump: 0.04, sx: 1.9, sy: 0.95 }), C.shoe, C.ink, sd + 12 + s * 2, { lw: 3 * U, sp: 2.8 * U });
    }
    shape(g, loopPts([P(-36, -194), P(36, -194), P(54, -84), P(-54, -84)], sd + 20), k.shirt, k.shirtLine, sd + 21, { lw: 3.8 * U, sp: 4 * U, ang: -0.9 });
    for (const [i, arm] of k.arms.entries()) crayonPath(g, arm.map(([dx, dy]) => P(dx, dy)), { color: k.shirt, width: 10 * U, seed: sd + 30 + i });
    if (k.hold) k.hold(g);
    for (const [i, arm] of k.arms.entries()) {
      const [dx, dy] = arm[arm.length - 1];
      shape(g, blobPts(x + dx, f + dy, 10, sd + 40 + i, { n: 14, lump: 0.05 }), C.face, C.faceLine, sd + 42 + i * 2, { lw: 2.6 * U, sp: 2.6 * U, knock: 1 });
    }
    shape(g, blobPts(hx, hy, hr, sd + 50, { n: 28, lump: 0.03 }), C.face, C.faceLine, sd + 51, { lw: 3.6 * U, sp: 3.6 * U, knock: 1 });
    k.hair(g, hx, hy, hr, sd + 70);
    for (const s of [-1, 1]) {
      crayonDot(g, hx + s * 15, hy + 4, 4.6, 6.6, C.ink, 1.1);
      crayonDot(g, hx + s * 15 - 1.5, hy + 1, 1.6, 1.6, C.white, 1.1);
      crayonDot(g, hx + s * 29, hy + 19, 8, 5, C.pink, 0.8);
    }
    crayonPath(g, arcPts(hx, hy + 13, 14, 0.4, Math.PI - 0.4, 4), { color: C.ink, width: 2.8 * U, lite: true, seed: sd + 60 });
    if (k.label) crayonText(g, k.label, x, hy - 86, [...k.label].length > 4 ? 25 : 30, C.ink, { seed: sd + 80, rot: (mulberry(sd)() - 0.5) * 0.1 });
  }
  function hairCap(hx, hy, hr, bangs, seed) {
    const pts = [], R = mulberry(seed);
    for (let i = 0; i <= 16; i++) { const a = Math.PI + 0.1 + (Math.PI - 0.2) * i / 16; pts.push([hx + Math.cos(a) * (hr + 5), hy + Math.sin(a) * (hr + 7)]); }
    for (let i = 0; i <= bangs; i++) {
      const t = i / bangs, xx = lerp(hx + hr * 0.96, hx - hr * 0.96, t);
      pts.push([xx, hy - 16 + (i % 2 ? 9 + R() * 4 : -3)]);
    }
    return pts;
  }
  function hairMop(g, hx, hy, hr, seed) {
    shape(g, hairCap(hx, hy, hr, 8, seed), C.hair, C.hairDark, seed + 1, { lw: 3.4 * U, sp: 3.4 * U, knock: 1 });
  }
  function hairBeret(g, hx, hy, hr, seed) {
    shape(g, hairCap(hx, hy, hr, 6, seed), C.black, C.black, seed + 1, { lw: 3 * U, sp: 3.2 * U, knock: 1 });
    shape(g, blobPts(hx + 6, hy - 40, 20, seed + 10, { n: 22, lump: 0.04, sx: 2.6, sy: 0.95, rot: -0.16 }), C.beret, C.beretLine, seed + 11, { lw: 3.4 * U, sp: 3.4 * U, knock: 2 });
    crayonPath(g, [[hx + 8, hy - 58], [hx + 11, hy - 68], [hx + 16, hy - 72]], { color: C.beretLine, width: 3.4 * U, lite: true, seed: seed + 15 });
  }
  // 登場人物: 自分はオレンジのシャツ、もう一方の AI はベレーぼう。名前・位置・うで・持ち物は場面ごとに決める
  const KID_ME = { shirt: C.shirtB, shirtLine: C.shirtBLine, pants: C.pants, pantsLine: C.pantsDark, hair: hairMop };
  const KID_FRIEND = { shirt: C.shirtC, shirtLine: C.shirtCLine, pants: C.pantsC, pantsLine: C.ink, hair: hairBeret };
  // うでの形 (足もとからの位置。最後の点が手)
  const ARMS = {
    waveAndReach: [[[-32, -180], [-60, -206], [-70, -238]], [[32, -180], [62, -192], [92, -214]]],
    holdFront: [[[-32, -180], [-52, -150], [-52, -124]], [[32, -180], [52, -150], [52, -124]]],
    down: [[[-32, -180], [-50, -140], [-56, -104]], [[32, -180], [50, -140], [56, -104]]],
  };
  function drawCrayonStick(g, x, y, len, ang, col, seed, wid = 15) {
    g.save(); g.translate(x, y); g.rotate(ang);
    const body = loopPts([[-len / 2, -wid / 2], [len / 2 - 14, -wid / 2], [len / 2 - 14, wid / 2], [-len / 2, wid / 2]], seed, 10, 0.5 * U);
    const tip = loopPts([[len / 2 - 14, -wid / 2 + 2], [len / 2 + 2, -1.5], [len / 2 + 2, 1.5], [len / 2 - 14, wid / 2 - 2]], seed + 1, 6, 0.3 * U);
    const band = loopPts([[-len * 0.22, -wid / 2 - 1], [len * 0.2, -wid / 2 - 1], [len * 0.2, wid / 2 + 1], [-len * 0.22, wid / 2 + 1]], seed + 2, 10, 0.4 * U);
    shape(g, body, col, C.ink, seed + 3, { lw: 2.8 * U, sp: 2.6 * U, ang: 0.2, knock: 2 });
    shape(g, tip, col, C.ink, seed + 5, { lw: 2.6 * U, sp: 2.2 * U, knock: 1 });
    knock(g, band, 0.5);
    crayonPath(g, closed(band, 2), { color: C.ink, width: 2.4 * U, lite: true, seed: seed + 7 });
    crayonPath(g, linePts(-len * 0.16, 0, len * 0.14, 0, 3), { color: col, width: 2.6 * U, lite: true, seed: seed + 8 });
    g.restore();
  }
  // 紙 1まい。mini なら中に小さな絵 (顔と赤い実) を描く
  function paperSheet(g, x, y, w, h, rot, line, seed, mini) {
    g.save(); g.translate(x, y); g.rotate(rot);
    const p = rrectPts(-w / 2, -h / 2, w, h, 3, seed);
    knock(g, p, 1);
    crayonPath(g, closed(p, 2), { color: line, width: 2.6 * U, lite: true, seed: seed + 1 });
    if (mini) {
      const fr = Math.min(w, h) * 0.2;
      crayonFill(g, blobPts(-w * 0.12, -h * 0.1, fr, seed + 2, { n: 12, lump: 0.04 }), C.face, seed + 3, { alpha: 0.9, spacing: 2 * U });
      crayonPath(g, arcPts(-w * 0.12, -h * 0.1, fr * 1.15, Math.PI + 0.2, Math.PI * 2 - 0.2, 3), { color: C.hair, width: 2.4 * U, lite: true, seed: seed + 4 });
      crayonDot(g, w * 0.2, h * 0.2, fr * 0.6, fr * 0.7, C.red, 1);
      crayonPath(g, [[w * 0.14, h * 0.06], [w * 0.2, h * 0.1], [w * 0.26, h * 0.06]], { color: C.green, width: 2 * U, lite: true, seed: seed + 5 });
    }
    g.restore();
  }

  // ---------- 場面 (日記ごとに書き換える) ----------
  // 例: 自分がクレヨンでパソコンに絵をかき、もう一方の AI が紙をかかえている。空は左が朝、右が夜
  function drawScene(g) {
    drawSky(g, 'both');
    drawGround(g);
    drawMonitor(g, { x: 300, y: 132, w: 310, h: 228 }, (g2, s) => {
      const cx = s.x + s.w / 2;
      const tw = crayonWord(g2, 'えにっき', cx, s.y + 36, 30, [C.red, C.orange, C.green, C.blue], 40);
      crayonPath(g2, wavePts(cx - tw * 0.5, cx + tw * 0.5, s.y + 58, 2.6, 2.5), { color: C.orange, width: 3.6 * U, seed: 50 });
      shape(g2, starPts(cx - 58, s.y + 122, 40, 18, -Math.PI / 2), C.yellow, C.amber, 70, { lw: 3.4 * U, sp: 3 * U, knock: 2 });
      shape(g2, heartPts(cx + 58, s.y + 118, 38), C.red, C.redDark, 74, { lw: 3.4 * U, sp: 3 * U, knock: 2 });
    });
    const me = { x: 165, foot: 455 }, hand = ARMS.waveAndReach[1][2], hx = me.x + hand[0], hy = me.foot + hand[1];
    drawKid(g, {
      ...KID_ME, ...me, label: 'ぼく', seed: 1200, arms: ARMS.waveAndReach,
      hold(g2) {
        const ang = Math.atan2(190 - hy, 322 - hx);
        drawCrayonStick(g2, hx + Math.cos(ang) * 26, hy + Math.sin(ang) * 26, 96, ang, C.red, 1290, 17);
        crayonPath(g2, [[324, 196], [334, 186], [330, 204], [342, 194], [338, 212]], { color: C.red, width: 3.2 * U, lite: true, seed: 1299 });
      },
    });
    const fx = 745, ff = 455;
    drawKid(g, {
      ...KID_FRIEND, x: fx, foot: ff, label: 'コーデックスくん', seed: 2200, arms: ARMS.holdFront,
      hold(g2) {
        const cols = [C.blue, C.pink, C.amber, C.green, C.grayDark];
        for (let i = 0; i < 5; i++) paperSheet(g2, fx + (i - 2) * 3, ff - 118 - i * 5, 104, 66, (i % 2 ? 1 : -1) * 0.05, cols[i], 2300 + i * 10, i === 4);
      },
    });
    [[634, 178, -0.3, C.blue], [642, 262, 0.22, C.pink], [874, 166, 0.34, C.amber], [872, 250, -0.2, C.green]]
      .forEach(([px, py, rot, col], i) => paperSheet(g, px, py, 36, 46, rot, col, 2400 + i * 10, true));
    drawCrayonStick(g, 252, 482, 62, -0.12, C.yellow, 1400, 14);
    drawCrayonStick(g, 288, 502, 58, 0.1, C.blue, 1410, 14);
  }
  function drawPicture(g) {
    g.save(); g.translate(FR.x, FR.y);
    g.beginPath(); g.rect(3, 3, FR.w - 6, FR.h - 6); g.clip();
    drawScene(g);
    g.restore();
  }

  // ---------- 描く ----------
  function render() {
    const r = cv.getBoundingClientRect();
    const css = Math.max(200, r.width || 640);
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    let w = Math.round(css * dpr);
    w = Math.min(w, Math.round(Math.sqrt(6e6 * PW / PH)));
    const h = Math.round(w * PH / PW);
    S = w / PW;
    for (const c of [cv, bgC, inkC, penC]) { c.width = w; c.height = h; }
    drawPrinted(bg);
    clearLayer(ink); drawPicture(ink);
    clearLayer(pen); drawWriting(pen);
    composite();
  }

  let lastW = 0, timer = 0;
  function onResize() {
    const w = Math.round(cv.getBoundingClientRect().width);
    if (Math.abs(w - lastW) < 2) return;
    lastW = w; clearTimeout(timer); timer = setTimeout(render, 120);
  }
  async function boot() {
    setupCompositor();
    const kana = 'ぁあぃいぅうぇえぉおかがきぎくぐけげこごさざしじすずせぜそぞただちぢっつづてでとどなにぬねのはばぱひびぴふぶぷへべぺほぼぽまみむめもゃやゅゆょよらりるれろわをんァアィイゥウェエォオカガキギクグケゲコゴサザシジスズセゼソゾタダチヂッツヅテデトドナニヌネノハバパヒビピフブプヘベペホボポマミムメモャヤュユョヨラリルレロワヲンヴー';
    const sample = DIARY.paras.join('') + HEAD_ITEMS.map((it) => it[1]).join('') + kana;
    const fonts = document.fonts && document.fonts.load ? Promise.all([
      document.fonts.load(`40px "Yomogi"`, sample),
      document.fonts.load(`500 26px "Zen Maru Gothic"`, 'がつにちようびてんきなまえ'),
    ]) : Promise.resolve();
    await Promise.race([fonts.catch(() => {}), new Promise((res) => setTimeout(res, 2500))]);
    lastW = Math.round(cv.getBoundingClientRect().width);
    render();
    if (document.fonts) document.fonts.addEventListener?.('loadingdone', () => render());
    new ResizeObserver(onResize).observe(cv);
  }
  boot();
})();
</script>
